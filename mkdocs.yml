site_name: Thoughts on AI
site_author: Stefan Streichsbier
site_description: Exploring the impact of AI on *cybersecurity*, *entrepreneurship*, and our *daily lives*.
site_url: https://www.thoughtson.ai
copyright: Copyright &copy; 2024&ndash;2026 Stefan Streichsbier
watch:
  - includes
markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets:
       auto_append:
        - includes/abbreviations.md
  - pymdownx.superfences
  - pymdownx.details
  - pymdownx.keys
  - pymdownx.caret
  - pymdownx.mark
  - pymdownx.tilde
  - pymdownx.tasklist:
      custom_checkbox: true
nav:
  - Posts: index.md
  - Categories: categories.md
plugins:
  - blog:
      # The home page is the post list; posts live in docs/posts/.
      blog_dir: .
      # One stable URL per post: https://www.thoughtson.ai/posts/<slug>/
      # Every post sets `slug:` in its front matter so title edits never move it.
      post_url_format: "posts/{slug}"
      post_date_format: medium
      post_readtime: true
      draft_if_future_date: true
      pagination: false
  - redirects:
      redirect_maps:
        Thoughts/index.md: index.md
        Thoughts/2024/04/08/the-rise-of-ai-security-engineers/index.md: posts/the-rise-of-ai-security-engineers.md
        Thoughts/category/ai-amp-security/index.md: https://www.thoughtson.ai/category/security/
  - search:
      lang: en
  - social
  - minify:
      minify_html: true
  - rss:
      match_path: posts/.*
      date_from_meta:
        as_creation: date
      categories:
        - categories
theme:
  name: material
  custom_dir: overrides
  language: en
  favicon: assets/images/favicon.png
  # Fonts are self-hosted in docs/assets/fonts; nothing loads from Google.
  font: false
  # No palette: light and dark follow the visitor's system setting (see assets/stylesheets/site.css).
  features: []
extra_css:
  - assets/stylesheets/site.css
extra:
  # generator: false
  consent:
    title: Cookie consent
    # Each third party loads only after the visitor accepts it here; comments can also be loaded per page.
    cookies:
      analytics: Google Analytics
      github: GitHub comments (Giscus)
    actions:
      - reject
      - accept
    description: >- 
      We use cookies to recognize your repeated visits and preferences, as well
      as to measure the quality and relevance of the content. With your consent, you're helping us to
      make our content better.
  analytics:
    provider: google
    property: G-RQLFXGTWWD
  social:
    - icon: simple/x
      link: https://x.com/s_streichsbier
    - icon: simple/github
      link: https://github.com/streichsbaer
    - icon: fontawesome/brands/linkedin
      link: https://www.linkedin.com/in/sstreichsbier/
    - icon: simple/rss
      link: https://www.thoughtson.ai/feed_rss_created.xml