site_name: Thoughts on AI
site_author: Stefan Streichsbier
site_description: Exploring the impact of AI on *cybersecurity*, *entrepreneurship*, and our *daily lives*.
site_url: https://www.thoughtson.ai
copyright: Copyright &copy; 2024&ndash;2026 Stefan Streichsbier
watch:
  - includes
markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets:
       auto_append:
        - includes/abbreviations.md
  - pymdownx.superfences
  - pymdownx.details
  - pymdownx.keys
  - pymdownx.caret
  - pymdownx.mark
  - pymdownx.tilde
  - pymdownx.tasklist:
      custom_checkbox: true
nav:
  - Home:
    - index.md
  - Thoughts:
    - blog/index.md
    - Tags:
      - tags.md
plugins:
  - blog:
      blog_dir: blog
      # One stable URL per post: https://www.thoughtson.ai/blog/<slug>/
      # Every post sets `slug:` in its front matter so title edits never move it.
      post_url_format: "{slug}"
      post_readtime: true
      draft_on_serve: true
      draft_if_future_date: true
  - redirects:
      redirect_maps:
        Thoughts/index.md: blog/index.md
        Thoughts/2024/04/08/the-rise-of-ai-security-engineers/index.md: blog/posts/the-rise-of-ai-security-engineers.md
        Thoughts/category/ai-amp-security/index.md: https://www.thoughtson.ai/blog/category/ai-amp-security/
  - search:
      pipeline:
        - stopWordFilter
        - trimmer
      lang: en
  # Cards need the Cairo library; CI sets CARDS=true, local builds skip them unless you do too.
  - social:
      enabled: !ENV [CARDS, false]
  - minify:
      minify_html: true
  - tags:
      enabled: true
      tags: true
  - rss:
      match_path: blog/posts/.*
      date_from_meta:
        as_creation: date
      categories:
        - categories
        - tags 
theme:
  name: material
  custom_dir: overrides
  language: en
  favicon: assets/images/favicon.png
  font:
    text: Roboto
  icon:
    annotation: material/plus-circle-outline
    logo: material/robot-love-outline
  palette: 
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: white
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      toggle:
        icon: material/weather-sunny
        name: Switch to system preference
  features:
    - content.tooltips
    - header.autohide
    - navigation.footer
    - navigation.indexes
    - navigation.instant
    - navigation.instant.progress
    - navigation.sections
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.tracking
    - navigation.top
    - search.highlight
    - search.share
    - search.suggest
    - toc.follow
extra:
  # generator: false
  consent:
    title: Cookie consent
    actions:
      - reject
      - accept
    description: >- 
      We use cookies to recognize your repeated visits and preferences, as well
      as to measure the quality and relevance of the content. With your consent, you're helping us to
      make our content better.
  analytics:
    provider: google
    property: G-RQLFXGTWWD
    feedback:
      title: Was this page helpful?
      ratings:
        - icon: material/emoticon-happy-outline
          name: This page was helpful
          data: 1
          note: >-
            Thanks for your feedback!
        - icon: material/emoticon-sad-outline
          name: This page could be improved
          data: 0
          note: >- 
            Thanks for your feedback! Help us improve by sending a <a href="https://x.com/messages/compose?recipient_id=624523425" target="_blank" rel="noopener">direct message</a> on X.
  social:
    - icon: simple/x
      link: https://x.com/s_streichsbier
    - icon: simple/github
      link: https://github.com/streichsbaer
    - icon: fontawesome/brands/linkedin
      link: https://www.linkedin.com/in/sstreichsbier/
    - icon: simple/rss
      link: https://www.thoughtson.ai/feed_rss_created.xml