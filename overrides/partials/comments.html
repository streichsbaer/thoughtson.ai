{% if page.meta.comments %}
  <h2 id="__comments">Comments</h2>
  <!-- Giscus is a third party: it loads only when the visitor clicks the button below. -->
  <div id="__comments-gate">
    <p>Comments are hosted on GitHub through Giscus. Loading them shares your visit with GitHub.</p>
    <button type="button" class="md-button" id="__comments-load">Load comments</button>
  </div>
  <div id="__comments-frame"></div>
  <script>
    function __loadGiscus() {
      var gate = document.getElementById("__comments-gate")
      if (gate) gate.remove()
      var s = document.createElement("script")
      var attrs = {
        "src": "https://giscus.app/client.js",
        "data-repo": "streichsbaer/thoughtson.ai",
        "data-repo-id": "R_kgDOLk_ESw",
        "data-category": "Announcements",
        "data-category-id": "DIC_kwDOLk_ES84Cegak",
        "data-mapping": "pathname",
        "data-strict": "0",
        "data-reactions-enabled": "1",
        "data-emit-metadata": "1",
        "data-input-position": "top",
        "data-theme": "preferred_color_scheme",
        "data-lang": "en",
        "crossorigin": "anonymous"
      }
      for (var k in attrs) s.setAttribute(k, attrs[k])
      s.async = true
      document.getElementById("__comments-frame").appendChild(s)
    }
    document.getElementById("__comments-load").addEventListener("click", __loadGiscus)
  </script>

{% endif %}
