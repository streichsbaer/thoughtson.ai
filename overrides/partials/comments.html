{% if page.meta.comments %}
  <h2 id="__comments">{{ lang.t("meta.comments") }}</h2>
  <!-- Giscus is a third party: it loads only after the visitor accepts GitHub comments in the
       cookie settings, or clicks the button below for this page. -->
  <div id="__comments-gate">
    <p>Comments are hosted on GitHub through Giscus. Loading them shares your visit with GitHub.</p>
    <button type="button" class="md-button" id="__comments-load">Load comments</button>
  </div>
  <div id="__comments-frame"></div>
  <script>
    function __loadGiscus() {
      var gate = document.getElementById("__comments-gate")
      if (gate) gate.remove()
      var s = document.createElement("script")
      var attrs = {
        "src": "https://giscus.app/client.js",
        "data-repo": "streichsbaer/thoughtson.ai",
        "data-repo-id": "R_kgDOLk_ESw",
        "data-category": "Announcements",
        "data-category-id": "DIC_kwDOLk_ES84Cegak",
        "data-mapping": "pathname",
        "data-strict": "0",
        "data-reactions-enabled": "1",
        "data-emit-metadata": "1",
        "data-input-position": "top",
        "data-theme": "preferred_color_scheme",
        "data-lang": "en",
        "crossorigin": "anonymous"
      }
      for (var k in attrs) s.setAttribute(k, attrs[k])
      s.async = true
      document.getElementById("__comments-frame").appendChild(s)
    }
    var __consent = __md_get("__consent")
    if (__consent && __consent.github) {
      __loadGiscus()
    } else {
      document.getElementById("__comments-load").addEventListener("click", __loadGiscus)
    }
  </script>

  <!-- Synchronize Giscus theme with palette -->
  <script>
    var giscus = document.querySelector("script[src*=giscus]")

    // Set palette on initial load
    var palette = __md_get("__palette")
    if (giscus && palette && typeof palette.color === "object") {
      var theme = palette.color.scheme === "slate"
        ? "transparent_dark"
        : "light"

      // Instruct Giscus to set theme
      giscus.setAttribute("data-theme", theme) 
    }

    // Register event handlers after documented loaded
    document.addEventListener("DOMContentLoaded", function() {
      var ref = document.querySelector("[data-md-component=palette]")
      ref.addEventListener("change", function() {
        var palette = __md_get("__palette")
        if (palette && typeof palette.color === "object") {
          var theme = palette.color.scheme === "slate"
            ? "transparent_dark"
            : "light"

          // Instruct Giscus to change theme
          var frame = document.querySelector(".giscus-frame")
          if (frame) frame.contentWindow.postMessage(
            { giscus: { setConfig: { theme } } },
            "https://giscus.app"
          )
        }
      })
    })
  </script>
{% endif %}
